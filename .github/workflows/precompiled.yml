name: Precompiled gems

# Builds the source gem plus one precompiled native gem per platform (see
# NATIVE_PLATFORMS in the Rakefile), then installs each native gem on a matching
# OS/architecture and runs the test suite against it. Publishing is not
# automated: on a v* tag the gems are collected into a single artifact for the
# maintainer to `gem push`.

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gem:
    name: Build source gem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: mkdir -p pkg && gem build ox.gemspec --output "pkg/ox-$(ruby -Ilib -rox/version -e 'print Ox::VERSION').gem"
      - name: Install the source gem (compiles the extension) and load it
        run: |
          gem install --local --no-document pkg/ox-*.gem
          cd "$RUNNER_TEMP"
          # shellcheck disable=SC2016 # Ruby code, not shell expansions
          ruby -e 'require "ox"; abort "wrong binary" unless $LOADED_FEATURES.grep(%r{/ox/ox\.so\z}).any?; p Ox.load("<a b=\"1\"/>").attributes'
      - uses: actions/upload-artifact@v7
        with:
          name: gem-ruby
          path: pkg/*.gem
          if-no-files-found: error

  native-gem:
    name: Build ${{ matrix.platform }} gem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - arm-linux-gnu
          - arm-linux-musl
          - arm64-darwin
          - x64-mingw-ucrt
          - x86_64-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake gem:native:${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem
          if-no-files-found: error

  # macOS and Windows: install on the runner's own Ruby.
  test-native-gem:
    name: Test ${{ matrix.target.platform }} gem (Ruby ${{ matrix.ruby }})
    needs: [source-gem, native-gem]
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: arm64-darwin, os: macos-latest }
          - { platform: x86_64-darwin, os: macos-15-intel }
          - { platform: x64-mingw-ucrt, os: windows-latest }
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-{ruby,${{ matrix.target.platform }}}
          path: gems
          merge-multiple: true
      - run: sh .github/scripts/test-installed-gem.sh ${{ matrix.target.platform }} gems
        shell: bash

  # Linux: install inside the official Ruby images. The Alpine images have no C
  # compiler, so a gem that tried to build its extension there would fail.
  test-native-gem-linux:
    name: Test ${{ matrix.target.platform }} gem (Ruby ${{ matrix.ruby }})
    needs: [source-gem, native-gem]
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: x86_64-linux-gnu, os: ubuntu-latest, image: '', docker-platform: linux/amd64 }
          - { platform: x86_64-linux-musl, os: ubuntu-latest, image: '-alpine', docker-platform: linux/amd64 }
          - { platform: aarch64-linux-gnu, os: ubuntu-24.04-arm, image: '', docker-platform: linux/arm64 }
          - { platform: aarch64-linux-musl, os: ubuntu-24.04-arm, image: '-alpine', docker-platform: linux/arm64 }
          - { platform: arm-linux-gnu, os: ubuntu-24.04-arm, image: '', docker-platform: linux/arm/v7 }
          - { platform: arm-linux-musl, os: ubuntu-24.04-arm, image: '-alpine', docker-platform: linux/arm/v7 }
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-{ruby,${{ matrix.target.platform }}}
          path: gems
          merge-multiple: true
      - name: Set up QEMU
        if: matrix.target.docker-platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Install and test in ruby:${{ matrix.ruby }}${{ matrix.target.image }}
        run: >-
          docker run --rm --platform ${{ matrix.target.docker-platform }}
          -v "$PWD:/ox" -w /ox
          ruby:${{ matrix.ruby }}${{ matrix.target.image }}
          sh .github/scripts/test-installed-gem.sh ${{ matrix.target.platform }} gems

  collect-gems:
    name: Collect gems for release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-gem, test-native-gem, test-native-gem-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          path: gems
          merge-multiple: true
      - run: ls -l gems && (cd gems && sha256sum ./*.gem)
      - uses: actions/upload-artifact@v7
        with:
          name: release-gems
          path: gems/*.gem
          if-no-files-found: error
